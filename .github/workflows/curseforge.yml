# Uploads the addon to CurseForge when you push a tag like addon-v0.9.0.
# The tag must match "## Version:" in addon/WowGuild/WowGuild.toc.
# Needs the repository secret CF_API_TOKEN (CurseForge author dashboard → API tokens)
# and "## X-Curse-Project-ID: <id>" in the TOC.
name: Release addon to CurseForge

on:
  push:
    tags: ['addon-v*']

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the changelog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload to CurseForge
        run: node web/scripts/curseforge.js "$GITHUB_REF_NAME"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
