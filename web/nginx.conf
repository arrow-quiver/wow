# HowBowWoW download site: one static page that points to the newest Guild Camp installer on GitHub.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }

    # Old links: /get (in the guild MOTD) and /download land on the page or the newest release.
    location = /get { try_files /index.html =404; }
    location = /download { return 302 https://github.com/arrow-quiver/wow/releases/latest; }

    location ~* \.(png|svg)$ { expires 7d; try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
